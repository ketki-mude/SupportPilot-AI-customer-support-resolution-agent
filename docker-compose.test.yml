# Test and evaluation additions, used by `make test` and `make eval`.
# The running backend never sees the mock shop's code.
services:
  backend:
    volumes:
      # Read-only copy of the mock shop so backend tests can run it in-process and force failures.
      - ./mock_commerce:/mock_commerce:ro
      # `make eval` writes the summary report here, and refreshes the README's results block.
      - ./docs:/docs
      - ./README.md:/README.md
