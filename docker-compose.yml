name: supportpilot

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-supportpilot}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock_commerce:
    build:
      context: ./mock_commerce
      args:
        INSTALL_DEV: "true"
    environment:
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_SLOW_FRACTION: ${MOCK_SLOW_FRACTION:-0.5}
      MOCK_SLOW_SECONDS: ${MOCK_SLOW_SECONDS:-2}
      MOCK_RANDOM_SEED: ${MOCK_RANDOM_SEED:-}
    ports:
      - "127.0.0.1:${MOCK_COMMERCE_HOST_PORT:-8001}:8001"
    volumes:
      - ./mock_commerce:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  # A separate shop for evaluations: each case loads its own data here, never into the demo shop.
  mock_commerce_eval:
    build:
      context: ./mock_commerce
      args:
        INSTALL_DEV: "true"
    environment:
      MOCK_ADMIN_ENABLED: "true"
      MOCK_FAILURE_RATE: "0"
    volumes:
      - ./mock_commerce:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-supportpilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supportpilot}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-supportpilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supportpilot}_test
      MOCK_COMMERCE_URL: http://mock_commerce:8001
      EVAL_COMMERCE_URL: http://mock_commerce_eval:8001
      # Recorded in evaluation reports started from the API; `make up` passes the commit.
      EVAL_GIT_COMMIT: ${EVAL_GIT_COMMIT:-unknown}
      # Checkpoints hold plain JSON only; refuse to deserialize arbitrary Python types.
      LANGGRAPH_STRICT_MSGPACK: "true"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # The evaluation dataset and saved reports, for `make eval` and the /evals page.
      - ./evals:/evals
    depends_on:
      db:
        condition: service_healthy
      mock_commerce:
        condition: service_healthy
      mock_commerce_eval:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  frontend_node_modules:
