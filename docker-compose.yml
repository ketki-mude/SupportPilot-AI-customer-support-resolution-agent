name: supportpilot

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-supportpilot}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock_commerce:
    build:
      context: ./mock_commerce
      args:
        INSTALL_DEV: "true"
    environment:
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_SLOW_FRACTION: ${MOCK_SLOW_FRACTION:-0.5}
      MOCK_SLOW_SECONDS: ${MOCK_SLOW_SECONDS:-2}
      MOCK_RANDOM_SEED: ${MOCK_RANDOM_SEED:-}
    ports:
      - "127.0.0.1:${MOCK_COMMERCE_HOST_PORT:-8001}:8001"
    volumes:
      - ./mock_commerce:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-supportpilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supportpilot}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-supportpilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supportpilot}_test
      MOCK_COMMERCE_URL: http://mock_commerce:8001
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mock_commerce:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  db_data:
